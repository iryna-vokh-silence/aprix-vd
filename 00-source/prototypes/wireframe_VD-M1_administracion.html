<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprix VD · Administración</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --brand:#81001E; --brand-soft:#FDECEF; --brand-mid:#B3334E;
  --side:#262626; --side-hover:#333333; --side-text:#F2F2F2; --side-muted:#A3A3A3;
  --text:#1A1A1A; --muted:#6B6B6B; --faint:#9A9A9A;
  --border:#E5E5E5; --border-strong:#D4D4D4; --head:#F5F5F5; --row-alt:#FAFAFA; --bg:#FFFFFF; --page:#FFFFFF;
  --dark:#1F1F1F; --dark-hover:#333;
  --green:#166534; --green-bg:#ECFDF3; --green-bd:#ABEFC6;
  --amber:#854D0E; --amber-bg:#FFFBEC; --amber-bd:#F5D98B;
  --info:#0369A1; --info-bg:#F1F9FF; --info-bd:#B9E6FE;
  --red:#B42318; --red-bg:#FEF3F2; --red-bd:#FECDCA;
  --grey:#525252; --grey-bg:#F2F2F2;
  --radius:8px; --radius-sm:6px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::placeholder{color:var(--faint)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- demo bar ---------- */
.demobar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 16px;background:#111;color:#E5E5E5;font-size:12px;border-bottom:1px solid #333}
.demobar .tag{background:var(--brand);color:#fff;font-weight:600;padding:2px 8px;border-radius:4px;letter-spacing:.02em}
.demobar .grow{flex:1}
.demobar label{display:flex;align-items:center;gap:6px;color:#BDBDBD}
.demobar select{background:#222;color:#fff;border:1px solid #444;border-radius:4px;padding:3px 8px;font-size:12px}
.demobar button{background:#222;color:#fff;border:1px solid #444;border-radius:4px;padding:3px 10px;font-size:12px}
.demobar button:hover{background:#333}
.demobar .sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.demobar .sw i{width:28px;height:16px;border-radius:9px;background:#444;position:relative;transition:background .15s}
.demobar .sw i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
.demobar .sw.on i{background:var(--brand)}
.demobar .sw.on i::after{left:14px}

/* ---------- app shell ---------- */
.app{display:flex;min-height:calc(100vh - 34px);background:var(--page)}
.sidebar{width:272px;flex:0 0 272px;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:34px;height:calc(100vh - 34px);overflow:auto}
.sb-top{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.sb-logo{width:40px;height:40px;border-radius:8px;background:#3A3A3A}
.sb-brandbar{height:40px;flex:1;border-radius:8px;background:#3A3A3A}
.sb-collapse{width:32px;height:32px;border:0;background:transparent;color:#BDBDBD;display:grid;place-items:center;border-radius:6px}
.sb-collapse:hover{background:var(--side-hover)}
.nav{padding:6px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;color:var(--side-text);border:0;background:transparent;text-align:left;width:100%;font-size:15px}
.nav-item:hover{background:var(--side-hover)}
.nav-item .ic{width:20px;height:20px;flex:0 0 20px;display:grid;place-items:center;color:#D4D4D4}
.nav-item .lbl{flex:1}
.nav-item .chev{color:#BDBDBD;transition:transform .15s}
.nav-item.open .chev{transform:rotate(90deg)}
.nav-item.active{background:var(--brand);color:#fff;font-weight:600}
.nav-item.active .ic,.nav-item.active .chev{color:#fff}
.nav-item.disabled{opacity:.45;cursor:not-allowed}
.nav-sub{display:flex;flex-direction:column;gap:2px;padding:2px 0 6px 0}
.nav-sub .nav-item{padding:9px 12px 9px 44px;font-size:14px}
.nav-sub .nav-item.active{background:var(--brand)}
.nav-sec{padding:10px 12px 4px 44px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted)}
.nav-sub .nav-item .hu{font-size:10px;color:var(--side-muted);border:1px solid #4A4A4A;border-radius:4px;padding:0 5px;margin-left:auto}
.nav-item.active .hu{color:#fff;border-color:rgba(255,255,255,.5)}
.nav-item.soon .hu{border:0;color:#8A8A8A;font-style:italic}
.sb-bottom{padding:12px 16px 14px}
.usercard{display:flex;align-items:center;gap:10px;background:#3A3A3A;border-radius:8px;padding:12px 14px}
.usercard .nm{font-weight:600;font-size:14px}
.usercard .rl{font-size:12px;color:#BDBDBD}
.usercard .out{margin-left:auto;color:#D4D4D4;display:grid;place-items:center}
.release{font-size:11px;color:#8A8A8A;margin-top:10px}

.main{flex:1;min-width:0;padding:28px 36px 60px;background:var(--page)}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:14px}
.crumb .home{display:inline-grid;place-items:center;color:var(--muted)}
.crumb .sep{color:#C4C4C4}
.crumb .cur{color:var(--text)}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
.pagehead h1{font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.pagehead .sub{color:var(--muted);font-size:15px;margin-top:6px;max-width:80ch}
.pagehead .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid transparent;font-weight:500;font-size:14px;line-height:1.2;white-space:nowrap;transition:background .12s,color .12s,border-color .12s}
.btn.primary{background:var(--dark);color:#fff}
.btn.primary:hover{background:var(--dark-hover)}
.btn.brand{background:var(--brand);color:#fff}
.btn.brand:hover{background:#6A0019}
.btn.light{background:var(--grey-bg);color:var(--text)}
.btn.light:hover{background:#E8E8E8}
.btn.ghost{background:transparent;border-color:var(--border-strong);color:var(--text)}
.btn.ghost:hover{background:var(--head)}
.btn.link{background:transparent;color:var(--brand);padding:6px 8px;font-weight:600}
.btn.link:hover{background:var(--brand-soft)}
.btn.danger-link{background:transparent;color:var(--red);padding:6px 8px;font-weight:600}
.btn.danger-link:hover{background:var(--red-bg)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:6px}
.btn.xs{padding:4px 10px;font-size:12px;border-radius:6px}
.btn.pill{border:1px solid var(--red-bd);color:var(--red);background:#fff;padding:5px 10px;border-radius:6px;font-weight:500;font-size:13px}
.btn.pill:hover{background:var(--red-bg)}
.btn.pill.ok{border-color:var(--green-bd);color:var(--green)}
.btn.pill.ok:hover{background:var(--green-bg)}
.btn.pill.neutral{border-color:var(--border-strong);color:var(--text)}
.btn.pill.neutral:hover{background:var(--head)}
.btn.icon{padding:9px;width:40px;height:40px;justify-content:center}
.btn[disabled],.btn.disabled{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:inherit}

/* ---------- cards / layout ---------- */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);font-size:16px;font-weight:500}
.card-h .meta{font-size:13.5px;color:var(--muted);font-weight:400}
.card-b{padding:20px}
.grid{display:grid;gap:20px}
.g-2{grid-template-columns:1fr 1fr}
.g-side{grid-template-columns:320px 1fr}
.g-side-r{grid-template-columns:1fr 360px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:22px}
.kpi{border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px 16px;background:#fff}
.kpi .k{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600;margin-top:8px;letter-spacing:-.01em}
.kpi .s{font-size:13px;color:var(--muted);margin-top:4px}
.kpi.hl{border-color:var(--brand)}
.kpi.hl .k{color:var(--brand)}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.b{font-weight:600}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:0 14px;height:44px;flex:0 0 420px;background:#fff}
.search input{border:0;outline:0;flex:1;font-size:15px;background:transparent}
.search svg{color:var(--muted)}
.count{color:var(--muted);font-size:15px}
.segment{display:inline-flex;background:var(--grey-bg);border-radius:8px;padding:4px}
.segment button{border:0;background:transparent;padding:7px 14px;border-radius:6px;font-weight:500;color:var(--muted)}
.segment button.on{background:var(--dark);color:#fff}

/* tabs */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{border:0;background:transparent;padding:12px 16px;font-size:15px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab:hover{color:var(--text)}
.tabs.sm .tab{font-size:14px;padding:10px 14px}

/* table */
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{background:var(--head);text-align:left;font-weight:600;padding:12px 12px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text);font-size:14px}
.tbl td{padding:11px 12px;border-bottom:1px solid #EEEEEE;vertical-align:middle}
.tbl tr:nth-child(even) td{background:var(--row-alt)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:var(--brand-soft)}
.tbl td.acts{white-space:nowrap;text-align:right;position:sticky;right:0;background:#fff;box-shadow:-8px 0 12px -10px rgba(0,0,0,.25)}
.tbl th:last-child{position:sticky;right:0;background:var(--head)}
.tbl tr:nth-child(even) td.acts{background:var(--row-alt)}
.tbl tr.clickable:hover td.acts{background:var(--brand-soft)}
.tbl td.acts .btn{margin-left:4px}
.tbl .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tbl td.dim,.tbl tr.dim td{color:var(--faint)}
.tbl .empty{text-align:center;color:var(--muted);padding:40px 16px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:6px;font-size:12.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.chip.green{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}
.chip.amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd)}
.chip.info{background:var(--info-bg);color:var(--info);border-color:var(--info-bd)}
.chip.red{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.chip.grey{background:var(--grey-bg);color:var(--grey);border-color:#E0E0E0}
.chip.brand{background:var(--brand-soft);color:var(--brand);border-color:#F3C2CC}
.chip.dark{background:var(--dark);color:#fff}
.chip.outline{background:#fff;color:var(--text);border-color:var(--border-strong);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.green{background:#17B26A}.dot.grey{background:#B5B5B5}.dot.amber{background:#F59E0B}.dot.red{background:#D92D20}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:8px;border:1px solid;font-size:13.5px;line-height:1.45}
.banner.info{background:var(--info-bg);border-color:var(--info-bd);color:#0B4A6F}
.banner.amber{background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber)}
.banner.red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.banner.green{background:var(--green-bg);border-color:var(--green-bd);color:var(--green)}
.banner.grey{background:var(--head);border-color:var(--border);color:var(--grey)}
.banner svg{flex:0 0 18px;margin-top:1px}
.banner b{font-weight:600}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;font-weight:500;color:var(--text)}
.field .hint{font-size:12.5px;color:var(--muted)}
.inp,.sel,.ta{border:1px solid var(--border-strong);border-radius:8px;padding:11px 14px;font-size:15px;background:#fff;width:100%;color:var(--text)}
.inp[readonly],.inp:disabled,.sel:disabled,.ta:disabled{background:var(--head);color:var(--muted)}
.sel{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236B6B6B' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:38px}
.ta{min-height:84px;resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid>.field{min-width:0}
.grid>*{min-width:0}
.field .row{flex-wrap:wrap}
.fgrid .full{grid-column:1/-1}
.inline-num{display:flex;align-items:center;gap:8px}
.inline-num .inp{width:110px;text-align:center}
.derived{display:flex;align-items:center;justify-content:space-between;background:var(--head);border-radius:8px;padding:10px 14px;font-size:14px}
.derived b{font-variant-numeric:tabular-nums}

/* checkbox */
.cb{display:inline-flex;align-items:flex-start;gap:12px;cursor:pointer;user-select:none}
.cb .box{width:20px;height:20px;border-radius:5px;border:1.5px solid #C4C4C4;background:#fff;display:grid;place-items:center;flex:0 0 20px;margin-top:1px;transition:background .1s,border-color .1s}
.cb.on .box,.cb.ind .box{background:var(--brand);border-color:var(--brand)}
.cb .box svg{display:none;color:#fff}
.cb.on .box svg.chk{display:block}
.cb.ind .box svg.min{display:block}
.cb.dis{cursor:not-allowed}
.cb.dis .box{background:#F5F5F5;border-color:#E0E0E0}
.cb.dis.on .box{background:#C9A0AA;border-color:#C9A0AA}
.cb .txt{font-size:15px}
.cb.off .txt{color:var(--muted)}
.cb.dis .txt{color:var(--faint)}
/* toggle */
.tg{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.tg i{width:40px;height:22px;border-radius:12px;background:#CFCFCF;position:relative;transition:background .15s;flex:0 0 40px}
.tg i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg.on i{background:var(--brand)}
.tg.on i::after{left:21px}
.tg.dis{opacity:.5;cursor:not-allowed}

/* perms accordion */
.acc{border-top:1px solid var(--border)}
.acc:first-child{border-top:0}
.acc-h{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer}
.acc-h .chev{color:var(--muted);transition:transform .15s}
.acc.open .acc-h .chev{transform:rotate(90deg)}
.acc-h .ttl{font-size:16px;font-weight:500;flex:1}
.acc-h .cnt{color:var(--muted);font-size:14px}
.acc-b{display:none;padding:0 20px 14px 66px}
.acc.open .acc-b{display:block}
.acc-b .grp{font-size:13.5px;font-weight:600;color:var(--muted);margin:12px 0 8px}
.acc-b .cb{display:flex;padding:7px 0}
.acc.newgrp .acc-h .ttl::after{content:"Nuevo";margin-left:10px;font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);border:1px solid #F3C2CC;border-radius:4px;padding:1px 6px;vertical-align:middle}

/* role list */
.rolelist{display:flex;flex-direction:column;gap:4px;padding:12px}
.roleitem{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:6px;border:0;background:transparent;text-align:left;font-size:15px;color:var(--muted);width:100%}
.roleitem:hover{background:var(--head)}
.roleitem.on{background:var(--brand);color:#fff;font-weight:600}
.roleitem .nw{font-size:10.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);border:1px solid #F3C2CC;border-radius:4px;padding:1px 6px;margin-left:auto}
.roleitem.on .nw{color:#fff;background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}
.rolesec{padding:14px 14px 6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

/* filters drawer (inline) */
.filters{border:1px solid var(--border);border-radius:var(--radius);padding:20px;background:#fff;display:flex;flex-direction:column;gap:16px;align-self:flex-start;min-width:340px}
.filters h3{font-size:18px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.filters .fbtns{display:flex;justify-content:space-between;align-items:center;margin-top:6px}

/* big number */
.bignum{font-size:56px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--brand)}
.bignum small{font-size:24px;font-weight:600;color:var(--muted)}

/* steps / mini */
.pillrow{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:minmax(120px,160px) 1fr;gap:10px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
hr.sep{border:0;border-top:1px solid var(--border);margin:18px 0}

/* HU pins & panel */
.pin{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;background:var(--brand);border-radius:10px;padding:1px 6px;margin-left:6px;vertical-align:middle;letter-spacing:.02em;line-height:1.4;cursor:help;position:relative;top:-1px}
.pin.hl{animation:pulse 1.2s ease-in-out 2;box-shadow:0 0 0 4px rgba(129,0,30,.25)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
body.hu-off .pin{display:none}
.hupanel{width:330px;flex:0 0 330px;border-left:1px solid var(--border);background:#FBFBFB;position:sticky;top:34px;height:calc(100vh - 34px);overflow:auto;padding:20px 20px 40px;font-size:13.5px}
body.hu-off .hupanel{display:none}
.hupanel .eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.hupanel h3{font-size:16px;font-weight:600;margin:6px 0 10px;line-height:1.3}
.hupanel .story{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:14px;border-left:3px solid var(--brand);padding-left:10px}
.hupanel .acl{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.hupanel .acl li{display:flex;gap:10px;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;line-height:1.4}
.hupanel .acl li:hover{border-color:var(--brand)}
.hupanel .acl li .n{font-size:11px;font-weight:700;color:var(--brand);white-space:nowrap;margin-top:2px}
.hupanel .acl li.na{opacity:.6}
.hupanel .acl li.na .n{color:var(--faint)}
.hupanel h4{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.hupanel .note{background:#fff;border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px;line-height:1.45}
.hupanel .note.q{border-left:3px solid var(--amber)}
.hupanel .note.d{border-left:3px solid var(--info)}
.hupanel .legend{font-size:12px;color:var(--muted);margin-top:14px}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:80;display:none}
.drawer-bg.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:100vw;background:#fff;z-index:81;box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.drawer-h h3{font-size:18px;font-weight:600}
.drawer-h .sub{font-size:13px;color:var(--muted);margin-top:2px}
.drawer-b{padding:22px 24px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.drawer-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border)}
.drawer.wide{width:720px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;width:600px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:18px;font-weight:600}
.modal-h .acts{display:flex;gap:8px}
.modal-b{padding:22px;display:flex;flex-direction:column;gap:14px;font-size:14.5px;line-height:1.5}
.modal.wide{width:820px}

/* toast */
.toasts{position:fixed;right:24px;bottom:24px;z-index:100;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--dark);color:#fff;padding:12px 16px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;max-width:460px;animation:slide .2s ease}
.toast.ok{border-left:4px solid #17B26A}.toast.warn{border-left:4px solid #F59E0B}.toast.err{border-left:4px solid #F04438}
@keyframes slide{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* empty / no access */
.noaccess{border:1px dashed var(--border-strong);border-radius:12px;padding:60px 30px;text-align:center;color:var(--muted)}
.noaccess h2{font-size:20px;color:var(--text);margin-bottom:8px}

/* version list */
.vlist{display:flex;flex-direction:column;gap:10px}
.vitem{border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;gap:14px;align-items:flex-start}
.vitem .vn{font-weight:700;color:var(--brand);white-space:nowrap;min-width:36px}
.vitem .vd{color:var(--muted);font-size:12.5px;margin-top:2px}
.vitem.cur{border-color:var(--brand);background:var(--brand-soft)}

/* matrix */
.matrix td.c{text-align:center}
.tick{color:#17B26A;font-weight:700}
.cross{color:#C4C4C4}

/* sticky save bar */
.savebar{position:sticky;bottom:0;display:flex;align-items:center;gap:14px;padding:14px 20px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 -6px 24px rgba(0,0,0,.08);margin-top:18px}
.savebar .msg{flex:1;font-weight:500}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:1380px){.hupanel{display:none}}
@media (max-width:1100px){.kpis{grid-template-columns:1fr 1fr}.g-side,.g-side-r{grid-template-columns:1fr}.sidebar{width:230px;flex-basis:230px}}
@media (max-width:760px){.app{flex-direction:column}.sidebar{position:static;height:auto;width:100%;flex-basis:auto}.main{padding:20px 16px}.kpis{grid-template-columns:1fr}.search{flex:1}.pagehead{flex-direction:column}.fgrid{grid-template-columns:1fr}.drawer{width:100vw}}

function winStatus(w) {
  const { open, close, p } = winDates(w);

}

  };
}
function closeWindow(id) {
  const w = S.windows.find(x => x.id === id);
  openModal({ title: 'Cerrar ventana de validación', danger: true, confirm: 'Cerrar ventana', body: `<p>Se cerrará la ventana de <b>${procName(w.proc)}</b> para <b>${w.period} · ${w.year}</b>. Ninguna validación podrá ejecutarse para este proceso hasta que se reabra.</p><div class="field"><label>Motivo</label><textarea class="ta" id="cMot" placeholder="Motivo del cierre"></textarea></div>`, onConfirm: () => { const mot = $('#cMot').value.trim(); if (!mot) { toast('Indica el motivo.', 'err'); return false; } logEvent('Calendario de validación', 'Cierre manual de ventana', `${w.period} · ${procName(w.proc)}`, winStatus(w), 'Cerrada', mot); w.manual = 'closed'; w.motivo = mot; toast('Ventana cerrada.'); render(); } });
}
function reopenWindow(id) {
  const w = S.windows.find(x => x.id === id);
  openModal({ title: 'Reabrir ventana de validación', confirm: 'Reabrir', body: `<p>Se reabrirá la ventana de <b>${procName(w.proc)}</b> para <b>${w.period} · ${w.year}</b>; el estatus volverá a calcularse a partir de las fechas derivadas.</p><div class="field"><label>Motivo</label><textarea class="ta" id="rMot"></textarea></div>`, onConfirm: () => { const mot = $('#rMot').value.trim(); if (!mot) { toast('Indica el motivo.', 'err'); return false; } logEvent('Calendario de validación', 'Reapertura de ventana', `${w.period} · ${procName(w.proc)}`, 'Cerrada', 'Recalculada', mot); w.manual = null; w.motivo = ''; toast('Ventana reabierta.'); render(); } });
}
function simulateRun(id) {
  const w = S.windows.find(x => x.id === id); const { open, close } = winDates(w); const st = winStatus(w);
  const inputs = (S.inputs[w.period] || {})[w.proc]; const pr = S.procs.find(p => p.id === w.proc);
  const missing = inputs ? [pr.lp && !inputs.lp ? 'Lista de Producción' : null, pr.rp && !inputs.rp ? 'Reporte de Promociones' : null, pr.bi && !inputs.bi ? 'Banco de Imágenes' : null].filter(Boolean) : [];
  const inactive = (S.procInactive[w.period] || []).includes(w.proc);
  if (st !== 'Abierta') return openModal({ title: 'Ejecución bloqueada', hideConfirm: true, cancel: 'Entendido', body: banner('red', `<b>No es posible ejecutar la validación fuera de la ventana autorizada.</b> ${pin('06')}<br>Periodo: <b>${w.period} · ${w.year}</b> · Proceso: <b>${procName(w.proc)}</b> · Ventana vigente: <b>${fmt(open)} → ${fmt(close)}</b> (N${w.nOpen} / N${w.nClose}) · Estatus: <b>${st}</b>${w.manual === 'closed' ? ` · Cierre manual: ${esc(w.motivo)}` : ''}.`, 'warn') + `<p class="muted small">Código de catálogo: <b>ERR-SIS-002 · Ejecución fuera de ventana</b> (referencia al catálogo de errores).</p>` });
  if (inactive) return openModal({ title: 'Ejecución bloqueada', hideConfirm: true, cancel: 'Entendido', body: banner('red', `El proceso <b>${procName(w.proc)}</b> está <b>desactivado para ${w.period} · ${w.year}</b>. Su histórico se conserva; puede reactivarse desde Procesos e insumos.`, 'warn') });
  if (missing.length) return openModal({ title: 'Ejecución bloqueada por insumo', hideConfirm: true, cancel: 'Entendido', body: banner('amber', `La ventana está abierta, pero <b>${procName(w.proc)}</b> no tiene todos sus insumos obligatorios disponibles para <b>${w.period}</b>. Falta: <b>${missing.join(', ')}</b>. (VD-1.2 AC-04 · ERR-INS-001)`, 'warn') });
  toast(`${ICON.info} <span>Ventana abierta: la validación de <b>${procName(w.proc)}</b> puede ejecutarse (${w.period} · ${fmt(open)} → ${fmt(close)}). Insumos completos.</span>`, 'ok', 4500);
}

function renderHU() {
  const h = HU[route]; const p = $('#hupanel'); if (!h) { p.innerHTML = ''; return; }
  p.innerHTML = `<div class="eyebrow">${h.id} · Módulo 1 Administración</div><h3>${h.title}</h3><div class="story">${h.story}</div>
    <h4>Criterios de aceptación</h4><ul class="acl">${h.acs.map((a, i) => `<li data-hl="${pad(i + 1)}"><span class="n">AC-${pad(i + 1)}</span><span>${a}</span></li>`).join('')}</ul>
    <h4>Decisión de diseño</h4><div class="note d">${h.decision}</div>
    <h4>Para refinar con el cliente</h4>${h.q.map(q => `<div class="note q">${q}</div>`).join('')}
    <div class="legend">Los pines <span class="pin" style="margin:0 2px">0n</span> en la pantalla señalan dónde se cubre cada criterio. Clic en un criterio para resaltarlos. Fecha simulada: 22/09/2026.</div>`;
  $$('[data-hl]', p).forEach(li => li.onclick = () => { const n = li.dataset.hl; $$('.pin').forEach(x => x.classList.toggle('hl', x.dataset.ac === n)); const first = $(`.main .pin[data-ac="${n}"]`); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' }); else toast(`AC-${n}: se demuestra en otra acción de esta pantalla (modal, drawer o simulación).`, 'warn'); setTimeout(() => $$('.pin.hl').forEach(x => x.classList.remove('hl')), 2600); });
}

/* ===================== barra de demo ===================== */
function initDemobar() {
  const sel = $('#viewerSel'); sel.innerHTML = VIEWERS.map(v => `<option value="${v.id}" ${v.id === S.viewer ? 'selected' : ''}>${S.roles[v.role].name} — ${v.name}</option>`).join('');
  sel.onchange = () => { S.viewer = sel.value; ui.roleDirty = null; render(); toast(`Ahora ves Aprix como <b>${S.roles[viewer().role].name}</b>.`, 'ok', 2500); };
  const tg = $('#huToggle'); const setHU = on => { S.hu = on; tg.classList.toggle('on', on); tg.setAttribute('aria-checked', on); document.body.classList.toggle('hu-off', !on); try { localStorage.setItem('vd-hu', on ? '1' : '0'); } catch (e) { } };
  tg.onclick = () => setHU(!S.hu); tg.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setHU(!S.hu); } };
  let saved = null; try { saved = localStorage.getItem('vd-hu'); } catch (e) { }
  if (saved === '0' || (saved === null && window.innerWidth < 1700)) { setHU(false); try { localStorage.removeItem('vd-hu'); } catch (e) { } }
  $('#btnBitacora').onclick = openLog;
  $('#btnReset').onclick = () => { S = buildState(); ui = { calYear: 2026, calFilters: { period: '', proc: '', status: '' }, calSearch: '', calShowFilters: false, procSel: 'nac', procTab: 'cfg', ruleSet: null, ruleFilterProc: '', errTab: 'cat', errFilters: { cat: '', sev: '' }, roleSel: 'admin', roleTab: 'perms', roleDirty: null, accOpen: { 'vd.adm': true } }; route = 'cal'; initDemobar(); render(); toast('Demo reiniciada.'); };
}
initDemobar(); render();
